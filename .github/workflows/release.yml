name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-binary:
    name: Build binary (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Build release binary
        run: |
          cargo build --release
          mkdir -p dist
          tar -czf dist/prec-templ-linux-x86_64.tar.gz -C target/release prec-templ

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-linux-x86_64
          path: dist/prec-templ-linux-x86_64.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - runner: macos-13
            target: x86_64-apple-darwin
            manylinux: off
          - runner: macos-latest
            target: aarch64-apple-darwin
            manylinux: off
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: off
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist/*.whl

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binary, build-wheels]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Download all wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
