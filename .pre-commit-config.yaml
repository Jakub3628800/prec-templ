# ===============================================================================
# Generated by prec-templ v0.2.0
# Repository: https://github.com/Jakub3628800/prec-templ
#
# Detected technologies: python, github-actions
#
# To regenerate: prec-templ [--interactive]
# ===============================================================================
repos:
  # =====================
  # Base hooks
  # =====================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: trailing-whitespace
      name: Trim trailing whitespace
    - id: end-of-file-fixer
      name: Fix end of files
    - id: check-yaml
      name: Check YAML
    - id: check-toml
      name: Check TOML
    - id: check-added-large-files
      name: Check for added large files
    - id: check-merge-conflict
      name: Check for merge conflict strings
    - id: detect-private-key
      name: Detect private keys
    - id: detect-aws-credentials
      name: Detect AWS credentials
      args: [--allow-missing-credentials]
    - id: no-commit-to-branch
      name: Prevent commits to main/master
      always_run: false
      args: [--branch, main, --branch, master]
    - id: check-case-conflict
      name: Check for case conflicts
    - id: check-executables-have-shebangs
      name: Check executables have shebangs
    - id: check-ast
      name: Check Python AST
    - id: check-builtin-literals
      name: Check builtin literals
    - id: check-docstring-first
      name: Check docstring first
    - id: debug-statements
      name: Check for debug statements

  # =====================
  # Python hooks
  # =====================

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
    - id: ruff-format
      name: Format Python code with Ruff
      args: [--line-length=120]
    - id: ruff-check
      name: Run Ruff linter
      args: [--line-length=120]

  # =====================
  # GitHub Actions hooks
  # =====================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    - id: actionlint
      name: Lint GitHub Actions workflows
      description: Lint GitHub Actions workflow files
      files: '^\.github/workflows/.*\.(yml|yaml)$'
